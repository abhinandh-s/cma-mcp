[package]
name = "cma-mcp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "js"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "time"] }
tracing-web = "0.1"
