[package]
name = "cmapaper-mcp"
version = "2.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-embed = "8.0"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
